<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Musik Otomatis</title>
  <style>
    #playButton {
      display: none; /* Tombol disembunyikan */
    }
  </style>
</head>
<body>
  <h1>Halaman dengan Musik</h1>
  <p>Sentuh layar untuk mulai musik</p>

  <audio id="audio" autoplay loop>
    <source src="musik.mp3" type="audio/mpeg">
    Browser tidak mendukung audio.
  </audio>

  <button id="playButton">Mainkan Musik</button>

  <script>
    const audio = document.getElementById('audio');
    const btn = document.getElementById('playButton');

    // Untuk browser yang blokir autoplay
    document.body.addEventListener('click', () => {
      audio.play();
    }, { once: true }); // cukup sekali aja

    // Bisa juga manual pakai tombol kalau mau
    btn.addEventListener('click', () => {
      audio.play();
    });
  </script>
</body>
</html>
